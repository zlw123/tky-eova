<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EovaMeta</title>
    <!--
      legacy 运行时样式（第 104 轮接入）

      口径（与"运行时脚本"一致，见 src/compat/legacy-runtime.ts）：
      · **vendor 级**样式走**旧原路径** `/eova/lib/**`（由后端/开发代理提供），与本工程产物解耦 ——
        `eovaui.css` 是 249,482 字节的组件库样式（内含 10 处 data: URI），打进本工程产物只会重复一份，
        且它的版本必须与 `eovaui.js` 制品同步（同一次发布、同一份来源）。
      · **页面级**样式才 import（如 `Login.vue` 引 `login.css`，见第 94 轮）。

      依赖顺序与旧 `_block/base.html:2-3` 一致：先组件库，再公共样式。
    -->
    <link rel="stylesheet" href="/eova/lib/eova/eovaui.css" />
    <link rel="stylesheet" href="/eova/ui/css/common.css?v=4.0" />
    <!--
      `uzoo` 全局（"虫洞"：`{page:{}, vue:{}, app:{}}`）——旧栈由服务端 partial
      `_block/meta.html:6` 加载该资产；分离后没有服务端 partial，故在入口显式装配。
      URL 与旧栈逐字一致（含 `?v=1.2`）。见 src/compat/eova-ext.ts。
    -->
    <script type="text/javascript" src="/eova/ui/meta/eova.meta.js?v=1.2"></script>
    <!--
      `eova.template.js`（旧栈由 `_block/base.html:10` 加载，`?v=1.2.0` 逐字）—— 它提供两样**全局**能力：
      · `handlerButtonEvent(event)`：**自定义按钮（is_base=0）的全局派发器**（检查 `window[event]` 是否为函数，
        否则弹「function x() 无法调用…」；注释原文「如方法不存在会导致白屏」）
      · `onMetaObject`/`onMetaField`/`onReorderForm`/`onLayerSize`…：`_block/admin.html`（超管设置菜单）
        与 `_block/toolbar.html` 里 `onclick="onXxx()"` 依赖的全局函数
      ⇒ 不装配它，**超管菜单的 onclick 与自定义按钮都会静默失效**（只弹提示或什么都不发生）。
      取证：docs/.local/baseline/evidence/button-mechanism-contract.json
    -->
    <script type="text/javascript" src="/eova/_view/template/eova.template.js?v=1.2.0"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
